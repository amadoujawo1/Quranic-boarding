services:
  # Single unified service: Docker builds React + Flask together
  - type: web
    name: qbsms-app
    env: docker
    repo: https://github.com/amadoujawo1/Quranic-boarding
    branch: master
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          property: connectionString
          name: qbsms-db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: FLASK_DEBUG
        value: false

databases:
  - name: qbsms-db
    databaseName: qbsms
    user: qbsms_user
