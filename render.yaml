services:
  # Single unified service: Docker builds React + Flask together
  - type: web
    name: qbsms-app
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: FLASK_DEBUG
        value: false
