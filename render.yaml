services:
  # Frontend Static Site
  - type: web
    name: qbsms-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend Web Service (Docker)
  - type: web
    name: qbsms-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false # You will need to provide your MySQL database URL in the Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: qbsms-redis
          property: connectionString

  # Redis Instance
  - type: redis
    name: qbsms-redis
    ipAllowList: [] # restricts access to internal services only
    plan: free
