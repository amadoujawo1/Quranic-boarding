services:
  # Single unified service: Docker builds React + Flask together
  - type: web
    name: qbsms-app
    env: docker
    dockerfilePath: ./Dockerfile
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/prod.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: FLASK_DEBUG
        value: false
