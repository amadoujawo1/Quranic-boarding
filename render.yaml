services:
  # Single unified service: Flask serves both the API and the React SPA
  - type: web
    name: qbsms-app
    runtime: python
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd .. &&
      cp -r frontend/dist backend/dist &&
      pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: FLASK_DEBUG
        value: false
